<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinControl AI - Gestão Financeira & Conciliação</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        },
                        darkbg: '#0f172a',
                        darkcard: '#1e293b'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkbg text-slate-800 dark:text-slate-100 min-h-screen flex flex-col md:flex-row antialiased transition-colors duration-200">

<!-- Mobile Header -->
<div class="md:hidden flex items-center justify-between p-4 bg-white dark:bg-darkcard border-b dark:border-slate-700">
    <div class="flex items-center space-x-2">
        <i class="fa-solid fa-chart-line text-brand-600 text-2xl"></i>
        <span class="font-bold text-xl tracking-tight">FinControl <span class="text-brand-600">AI</span></span>
    </div>
    <button id="mobile-menu-btn" class="text-slate-600 dark:text-slate-300 focus:outline-none">
        <i class="fa-solid fa-bars text-xl"></i>
    </button>
</div>

<!-- Sidebar -->
<aside id="sidebar" class="hidden md:flex flex-col w-64 bg-white dark:bg-darkcard border-r dark:border-slate-800 p-4 shrink-0 transition-all duration-300 fixed md:relative z-40 inset-y-0 left-0">
    <div class="flex items-center space-x-3 px-2 py-3 mb-4">
        <i class="fa-solid fa-chart-line text-brand-600 text-2xl"></i>
        <span class="font-bold text-xl tracking-tight">FinControl <span class="text-brand-600">AI</span></span>
    </div>

    <!-- Switch Profile -->
    <div class="mb-6 bg-slate-100 dark:bg-slate-800 p-1.5 rounded-xl flex items-center">
        <button id="profile-personal-btn" onclick="setProfile('personal')" class="flex-1 text-xs font-semibold py-1.5 px-3 rounded-lg transition-all shadow-sm bg-white dark:bg-slate-700 text-slate-800 dark:text-white">
            <i class="fa-solid fa-user mr-1"></i> Pessoal
        </button>
        <button id="profile-business-btn" onclick="setProfile('business')" class="flex-1 text-xs font-semibold py-1.5 px-3 rounded-lg transition-all text-slate-500 dark:text-slate-400">
            <i class="fa-solid fa-briefcase mr-1"></i> Empresa
        </button>
    </div>

    <!-- Navigation -->
    <nav class="space-y-1 flex-1">
        <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-item w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors bg-brand-50 dark:bg-brand-900/30 text-brand-700 dark:text-brand-400">
            <i class="fa-solid fa-house w-5"></i><span>Dashboard</span>
        </button>
        <button onclick="switchTab('transactions')" id="nav-transactions" class="nav-item
